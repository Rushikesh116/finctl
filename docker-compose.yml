# Local equivalent of the deployed container. The Dockerfile stays the source of truth so the
# same image runs here, on Render, and anywhere else.
services:
  finctl:
    build: .
    image: finctl:local
    ports:
      - "8000:8000"
    environment:
      # Same default as the image. Set to 0 and supply GEMINI_API_KEY to exercise the live
      # adjudicator, which is not what a demo should do.
      DEMO_MODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
